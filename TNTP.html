<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TNT HD – ChocoPop Flow</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
#player-container{position:relative;width:100%;height:100vh;}
#player{width:100%;height:100%;}
.chocopop-logo{
  position:absolute;
  bottom:54px;
  left:14px;
  z-index:9999;
  pointer-events:none;
  opacity:.92;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));
}
.chocopop-logo img{
  height:36px;
  width:auto;
}
</style>
</head>
<body>
<div id="player-container">
  <div id="player"></div>
  <div class="chocopop-logo">
    <img src="ChocoPop_Flow.png" alt="ChocoPop Flow" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div style="display:none;align-items:center;gap:4px;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;">
      <span style="font-family:'Arial Black',sans-serif;font-size:13px;font-weight:900;color:#f5c200;letter-spacing:1px;text-shadow:1px 1px 0 #b85c00;">Choco</span><span style="font-family:'Arial Black',sans-serif;font-size:13px;font-weight:900;color:#e03020;letter-spacing:1px;text-shadow:1px 1px 0 #7a1000;">Pop</span><span style="font-family:'Arial Black',sans-serif;font-size:12px;font-weight:700;color:#fff;letter-spacing:.5px;margin-left:3px;opacity:.85;">FLOW</span>
    </div>
  </div>
</div>

<script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
<script>
jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";

var ch = {
  nombre: "TNT HD",
  b64: "VE5UX0hEX0FyZw==",
  n: 3,
  k1: "faad1722a575f4d9ec7b774db63c879c",
  k2: "cf0184830344ba36ad2ffef9dd2dd9d0"
};

var CDN_HOSTS = ["cdn","chromecast"];
function rndHost(){ return CDN_HOSTS[Math.floor(Math.random()*CDN_HOSTS.length)]; }

var host = rndHost();
var canal = atob(ch.b64);
var url = "https://"+host+".cvattv.com.ar/live/c"+ch.n+"eds/"+canal+"/SA_Live_dash_enc_C/"+canal+".mpd";

jwplayer("player").setup({
  playlist:[{
    title: ch.nombre,
    description: "EN VIVO",
    sources:[{
      file: url,
      type: "dash",
      drm:{ clearkey:{ keyId: ch.k1, key: ch.k2 } }
    }]
  }],
  autostart: true,
  mute: false,
  volume: 100,
  width: "100%",
  height: "100%",
  stretching: "exactfit",
  preload: "auto",
  cast: {},
  sharing: {}
});

var p = jwplayer("player");

p.on("error", function(){
  var altHost = host==="cdn" ? "chromecast" : "cdn";
  var altUrl = "https://"+altHost+".cvattv.com.ar/live/c"+ch.n+"eds/"+canal+"/SA_Live_dash_enc_C/"+canal+".mpd";
  try{
    p.load([{sources:[{file:altUrl,type:"dash",drm:{clearkey:{keyId:ch.k1,key:ch.k2}}}]}]);
    p.play();
  }catch(e){}
});

p.on("play", function(){
  try{ p.setCurrentAudioTrack(1); }catch(e){}
});

p.on("fullscreen", function(e){
  if(screen.orientation){
    if(e.fullscreen){ (async function t(){ try{ await screen.orientation.lock("landscape"); }catch(err){ setTimeout(t,200); } })(); }
    else{ try{ screen.orientation.unlock(); }catch(err){} }
  }
});
</script>
</body>
</html>
