<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChocoPop Flow Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --choco: #5C2E00;
    --gold: #F5A800;
    --gold2: #FFD000;
    --red: #C0392B;
    --cream: #FFF8E7;
    --dark: #1a0a00;
    --ctrl-bg: rgba(15,5,0,0.82);
    --ctrl-h: 54px;
  }

  body {
    background: radial-gradient(ellipse at 60% 40%, #3a1800 0%, #0d0400 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    color: var(--cream);
  }

  .player-shell {
    width: min(960px, 98vw);
    background: linear-gradient(160deg, #2a0e00 0%, #1a0500 100%);
    border-radius: 22px;
    border: 2.5px solid #6b3300;
    box-shadow: 0 0 60px #f5a80033, 0 8px 48px #00000099;
    overflow: hidden;
  }

  /* ─── Header ─── */
  .player-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: linear-gradient(90deg, #3d1500 0%, #1a0800 100%);
    border-bottom: 2px solid #6b3300;
  }
  .player-header img { height: 44px; filter: drop-shadow(0 2px 6px #00000088); }
  .header-info { flex: 1; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--red); color: #fff; font-size: 11px; font-weight: 800;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px;
  }
  .live-dot { width: 7px; height: 7px; background: #fff; border-radius: 50%; animation: blink 1.1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .stream-url { font-size: 11px; color: #c97a30; margin-top: 3px; word-break: break-all; }

  /* ─── Video Wrap ─── */
  .video-wrap {
    position: relative;
    background: #000;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
  }
  video {
    width: 100%; height: 100%;
    display: block;
    background: #000;
    cursor: pointer;
  }
  .overlay-logo {
    position: absolute;
    bottom: 68px;
    right: 14px;
    height: 48px;
    z-index: 20;
    pointer-events: none;
    filter: drop-shadow(0 2px 8px #00000099);
    opacity: 0.92;
  }
  .loading-spinner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 30;
    gap: 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    transition: opacity .3s;
  }
  .loading-spinner.hidden { opacity: 0; pointer-events: none; }
  .spinner-ring {
    width: 56px; height: 56px;
    border: 5px solid #5C2E0055;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(20,0,0,0.9);
    z-index: 35;
    gap: 12px;
    font-size: 15px;
    color: #f88;
    font-weight: 700;
    text-align: center;
    padding: 20px;
  }
  .error-msg.show { display: flex; }

  /* ─── Controls bar ─── */
  .controls {
    background: var(--ctrl-bg);
    border-top: 1.5px solid #6b330066;
    padding: 0 16px;
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 4px;
  }
  .progress-wrap {
    flex: 1;
    position: relative;
    height: 5px;
    background: #5C2E0055;
    border-radius: 4px;
    cursor: pointer;
  }
  .progress-wrap:hover { height: 7px; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 4px;
    position: relative;
    transition: width .15s linear;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -6px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--gold2);
    box-shadow: 0 0 6px var(--gold);
    opacity: 0;
    transition: opacity .2s;
  }
  .progress-wrap:hover .progress-fill::after { opacity: 1; }
  .time-disp { font-size: 11px; color: #c97a30; min-width: 80px; text-align: right; white-space: nowrap; }

  /* Buttons row */
  .btn-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0 10px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    color: var(--cream); display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    transition: background .15s, color .15s;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { background: #5C2E0099; color: var(--gold); }
  .ctrl-btn svg { width: 20px; height: 20px; }

  /* Volume */
  .volume-wrap { display: flex; align-items: center; gap: 6px; }
  .volume-slider { width: 70px; height: 4px; appearance: none; background: #5C2E0055; border-radius: 4px; cursor: pointer; accent-color: var(--gold); }
  .volume-slider::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--gold2); }

  /* Spacer */
  .spacer { flex: 1; }

  /* Dropdown menus */
  .menu-wrap { position: relative; }
  .menu-btn {
    background: #3d1500; border: 1.5px solid #6b3300; border-radius: 8px;
    color: var(--cream); font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 700; cursor: pointer;
    padding: 5px 10px; height: 32px; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, border-color .15s;
  }
  .menu-btn:hover { background: #5C2E00; border-color: var(--gold); color: var(--gold); }
  .menu-btn .arrow { font-size: 8px; transition: transform .2s; }
  .menu-btn.open .arrow { transform: rotate(180deg); }

  .dropdown {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: #1e0800;
    border: 1.5px solid #6b3300;
    border-radius: 10px;
    min-width: 150px;
    display: none;
    flex-direction: column;
    padding: 6px;
    z-index: 100;
    box-shadow: 0 -8px 32px #00000099;
  }
  .dropdown.show { display: flex; }
  .dropdown-title {
    font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: var(--gold); padding: 4px 8px 2px; border-bottom: 1px solid #5C2E0055; margin-bottom: 4px;
  }
  .dd-item {
    background: none; border: none; cursor: pointer;
    color: var(--cream); font-family: 'Nunito', sans-serif;
    font-size: 13px; font-weight: 600;
    padding: 7px 10px; border-radius: 6px; text-align: left;
    transition: background .12s, color .12s;
  }
  .dd-item:hover { background: #5C2E00; color: var(--gold); }
  .dd-item.active { color: var(--gold2); font-weight: 800; }

  /* Buffer info bar */
  .info-row {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding: 0 0 10px;
    font-size: 11px; color: #c97a30;
  }
  .info-pill {
    background: #2a0e0066; border: 1px solid #5C2E0055;
    border-radius: 20px; padding: 2px 10px; white-space: nowrap;
  }
  .info-pill span { color: var(--gold2); font-weight: 700; }

</style>
</head>
<body>

<div class="player-shell">

  <!-- Header -->
  <div class="player-header">
    <img src="/mnt/user-data/uploads/ChocoPop_Flow.png" alt="ChocoPop Flow" onerror="this.style.display='none'">
    <div class="header-info">
      <div class="live-badge"><span class="live-dot"></span>EN VIVO</div>
      <div class="stream-url">http://45.5.151.147:8000/play/a00n/index.m3u8</div>
    </div>
  </div>

  <!-- Video -->
  <div class="video-wrap">
    <video id="vid" playsinline></video>

    <!-- Overlay logo (bottom-right) -->
    <img class="overlay-logo" id="overlayLogo" src="/mnt/user-data/uploads/ChocoPop_Flow.png" alt="ChocoPop Flow">

    <!-- Loading -->
    <div class="loading-spinner" id="loader">
      <div class="spinner-ring"></div>
      Cargando señal...
    </div>

    <!-- Error -->
    <div class="error-msg" id="errMsg">
      ⚠️ No se pudo cargar la señal.<br>
      <small id="errDetail"></small>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">

    <!-- Progress -->
    <div class="progress-row">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-disp" id="timeDisp">LIVE</div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">

      <!-- Play/Pause -->
      <button class="ctrl-btn" id="playBtn" title="Play / Pausa">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      </button>

      <!-- Stop -->
      <button class="ctrl-btn" id="stopBtn" title="Detener">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>

      <!-- Rewind 10s -->
      <button class="ctrl-btn" id="rewBtn" title="Retroceder 10s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/><text x="8" y="15" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">10</text></svg>
      </button>

      <!-- Forward 10s -->
      <button class="ctrl-btn" id="fwdBtn" title="Adelantar 10s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3"/><text x="8" y="15" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">10</text></svg>
      </button>

      <!-- Volume -->
      <div class="volume-wrap">
        <button class="ctrl-btn" id="muteBtn" title="Silencio">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.02" value="1">
      </div>

      <div class="spacer"></div>

      <!-- Quality menu -->
      <div class="menu-wrap">
        <button class="menu-btn" id="qualBtn">🎬 Calidad <span class="arrow">▲</span></button>
        <div class="dropdown" id="qualMenu">
          <div class="dropdown-title">Calidad</div>
          <button class="dd-item active" data-level="-1">Auto</button>
        </div>
      </div>

      <!-- Speed menu -->
      <div class="menu-wrap">
        <button class="menu-btn" id="speedBtn">⚡ Velocidad <span class="arrow">▲</span></button>
        <div class="dropdown" id="speedMenu">
          <div class="dropdown-title">Velocidad</div>
          <button class="dd-item" data-speed="0.25">0.25×</button>
          <button class="dd-item" data-speed="0.5">0.5×</button>
          <button class="dd-item" data-speed="0.75">0.75×</button>
          <button class="dd-item active" data-speed="1">1× Normal</button>
          <button class="dd-item" data-speed="1.25">1.25×</button>
          <button class="dd-item" data-speed="1.5">1.5×</button>
          <button class="dd-item" data-speed="2">2×</button>
        </div>
      </div>

      <!-- Buffer menu -->
      <div class="menu-wrap">
        <button class="menu-btn" id="bufBtn">🔋 Buffer <span class="arrow">▲</span></button>
        <div class="dropdown" id="bufMenu">
          <div class="dropdown-title">Buffer máximo</div>
          <button class="dd-item" data-buf="10">10 s</button>
          <button class="dd-item" data-buf="20">20 s</button>
          <button class="dd-item active" data-buf="30">30 s (defecto)</button>
          <button class="dd-item" data-buf="60">60 s</button>
          <button class="dd-item" data-buf="120">120 s</button>
        </div>
      </div>

      <!-- Fullscreen -->
      <button class="ctrl-btn" id="fsBtn" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>

    </div><!-- btn-row -->

    <!-- Info / stats -->
    <div class="info-row">
      <div class="info-pill">Buffer: <span id="statBuf">0.00 s</span></div>
      <div class="info-pill">Nivel HLS: <span id="statLevel">Auto</span></div>
      <div class="info-pill">Velocidad: <span id="statSpeed">1×</span></div>
      <div class="info-pill">Bitrate: <span id="statBitrate">—</span></div>
      <div class="info-pill">Resolución: <span id="statRes">—</span></div>
    </div>

  </div><!-- controls -->
</div><!-- player-shell -->

<script>
const SRC = 'http://45.5.151.147:8000/play/a00n/index.m3u8';
const vid  = document.getElementById('vid');
const loader = document.getElementById('loader');
const errMsg = document.getElementById('errMsg');
const errDetail = document.getElementById('errDetail');

let hls, currentBuf = 30;

/* ── HLS init ── */
function initHLS() {
  if (Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({
      maxBufferLength: currentBuf,
      maxMaxBufferLength: currentBuf * 2,
      enableWorker: true,
    });
    hls.loadSource(SRC);
    hls.attachMedia(vid);

    hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
      loader.classList.add('hidden');
      buildQualityMenu(data.levels);
      vid.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
      const lvl = hls.levels[data.level];
      document.getElementById('statLevel').textContent = data.level === -1 ? 'Auto' : `${data.level}`;
      if (lvl) {
        document.getElementById('statBitrate').textContent = (lvl.bitrate/1000).toFixed(0)+' kbps';
        document.getElementById('statRes').textContent = lvl.width ? `${lvl.width}×${lvl.height}` : '—';
      }
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        errDetail.textContent = data.details;
        errMsg.classList.add('show');
        loader.classList.add('hidden');
      }
    });

  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = SRC;
    vid.addEventListener('loadedmetadata', () => {
      loader.classList.add('hidden');
      vid.play().catch(()=>{});
    });
  } else {
    errDetail.textContent = 'Tu navegador no soporta HLS.';
    errMsg.classList.add('show');
    loader.classList.add('hidden');
  }
}
initHLS();

/* ── Quality menu builder ── */
function buildQualityMenu(levels) {
  const menu = document.getElementById('qualMenu');
  // clear except auto
  [...menu.querySelectorAll('.dd-item')].forEach(b => b.remove());
  const auto = document.createElement('button');
  auto.className = 'dd-item active';
  auto.dataset.level = -1;
  auto.textContent = 'Auto';
  menu.appendChild(auto);

  levels.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'dd-item';
    b.dataset.level = i;
    b.textContent = l.height ? `${l.height}p — ${(l.bitrate/1000).toFixed(0)} kbps` : `Nivel ${i}`;
    menu.appendChild(b);
  });

  menu.querySelectorAll('.dd-item').forEach(b => {
    b.addEventListener('click', () => {
      const lvl = parseInt(b.dataset.level);
      hls.currentLevel = lvl;
      hls.loadLevel = lvl;
      menu.querySelectorAll('.dd-item').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('statLevel').textContent = lvl === -1 ? 'Auto' : `${lvl}`;
      closeAll();
    });
  });
}

/* ── Play / Pause ── */
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
function updatePlayIcon() {
  playIcon.innerHTML = vid.paused
    ? '<polygon points="5,3 19,12 5,21"/>'
    : '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
}
playBtn.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
vid.addEventListener('play', updatePlayIcon);
vid.addEventListener('pause', updatePlayIcon);

/* ── Stop ── */
document.getElementById('stopBtn').addEventListener('click', () => {
  vid.pause(); vid.currentTime = 0;
});

/* ── Seek ── */
document.getElementById('rewBtn').addEventListener('click', () => vid.currentTime = Math.max(0, vid.currentTime - 10));
document.getElementById('fwdBtn').addEventListener('click', () => vid.currentTime = vid.currentTime + 10);

/* ── Progress ── */
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const timeDisp = document.getElementById('timeDisp');
vid.addEventListener('timeupdate', () => {
  if (!vid.duration || isNaN(vid.duration)) { timeDisp.textContent = 'LIVE'; progressFill.style.width = '0%'; return; }
  const pct = (vid.currentTime / vid.duration) * 100;
  progressFill.style.width = pct + '%';
  timeDisp.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
});
progressWrap.addEventListener('click', e => {
  if (!vid.duration || isNaN(vid.duration)) return;
  const rect = progressWrap.getBoundingClientRect();
  vid.currentTime = ((e.clientX - rect.left) / rect.width) * vid.duration;
});
function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}

/* ── Volume ── */
const muteBtn = document.getElementById('muteBtn');
const volSlider = document.getElementById('volSlider');
const volIcon = document.getElementById('volIcon');
volSlider.addEventListener('input', () => { vid.volume = volSlider.value; vid.muted = false; updateVolIcon(); });
muteBtn.addEventListener('click', () => { vid.muted = !vid.muted; updateVolIcon(); });
function updateVolIcon() {
  const v = vid.muted || vid.volume === 0;
  volIcon.innerHTML = v
    ? '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/>'
    : '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
}

/* ── Speed ── */
document.getElementById('speedMenu').querySelectorAll('.dd-item').forEach(b => {
  b.addEventListener('click', () => {
    const sp = parseFloat(b.dataset.speed);
    vid.playbackRate = sp;
    document.getElementById('statSpeed').textContent = sp + '×';
    document.getElementById('speedMenu').querySelectorAll('.dd-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('speedBtn').querySelector('span:first-child').textContent = '⚡ ' + sp + '×';
    closeAll();
  });
});

/* ── Buffer ── */
document.getElementById('bufMenu').querySelectorAll('.dd-item').forEach(b => {
  b.addEventListener('click', () => {
    currentBuf = parseInt(b.dataset.buf);
    if (hls) { hls.config.maxBufferLength = currentBuf; hls.config.maxMaxBufferLength = currentBuf * 2; }
    document.getElementById('bufMenu').querySelectorAll('.dd-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    closeAll();
  });
});

/* ── Buffer stats ── */
setInterval(() => {
  if (vid.buffered.length) {
    const buf = vid.buffered.end(vid.buffered.length - 1) - vid.currentTime;
    document.getElementById('statBuf').textContent = Math.max(0, buf).toFixed(2) + ' s';
  }
}, 500);

/* ── Fullscreen ── */
const fsBtn = document.getElementById('fsBtn');
fsBtn.addEventListener('click', () => {
  const el = document.querySelector('.video-wrap');
  if (!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
});

/* ── Click video to play/pause ── */
vid.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });

/* ── Dropdown toggles ── */
function closeAll() {
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('open'));
}
document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const target = btn.nextElementSibling;
    const wasOpen = target.classList.contains('show');
    closeAll();
    if (!wasOpen) { target.classList.add('show'); btn.classList.add('open'); }
  });
});
document.addEventListener('click', closeAll);

/* ── Loading & ready ── */
vid.addEventListener('waiting', () => loader.classList.remove('hidden'));
vid.addEventListener('playing', () => loader.classList.add('hidden'));
vid.addEventListener('canplay', () => loader.classList.add('hidden'));
</script>
</body>
</html>
